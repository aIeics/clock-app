[package]
name = "clock-app"
version = "1.0.0"
edition = "2024"
rust-version = "1.95" # minimum required by eframe 0.37
description = "Lightweight desktop clock: clock, timer, reminders and calendar."
license = "MIT"
repository = "https://github.com/aIeics/clock-app"
publish = false

# Keep this list short. Ask before adding a crate (see CLAUDE.md).
[dependencies]
# Local time and date math. Default features off: only the system clock and std.
# `serde` lets reminder dates be saved as ISO strings.
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
# GUI. Default features off: OpenGL (glow) instead of wgpu, built-in fonts only.
# x11/wayland only matter on Linux and add nothing to a Windows build.
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
# Saving settings and reminders as hand-editable JSON (decision D1 in PLAN.md).
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = { version = "1", default-features = false, features = ["std"] }

# System tray icon: close-to-tray behaviour. Linux-only default features stay off.
tray-icon = { version = "0.26", default-features = false }

# Windows only: "Start with Windows" (the HKCU Run registry key) and the
# single-instance check. eframe and tray-icon already build this exact crate,
# so it adds nothing to the build.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Threading",
] }

# Small, fast release binary.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
